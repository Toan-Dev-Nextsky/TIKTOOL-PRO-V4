<!DOCTYPE html><html lang="vi"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiệu Suất Widget</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }
    @keyframes pulse-glow {
      0%, 100% {
        opacity: 0.6;
        filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.45));
      }
      50% {
        opacity: 0.95;
        filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.75));
      }
    }
    @keyframes star-twinkle {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.12); opacity: 1; filter: drop-shadow(0 0 7px rgba(250, 204, 21, 0.8)); }
    }
    .star-anim {
      animation: star-twinkle 3s ease-in-out infinite;
    }
    .star-anim:nth-child(1) { animation-delay: 0s; }
    .star-anim:nth-child(2) { animation-delay: 0.2s; }
    .star-anim:nth-child(3) { animation-delay: 0.4s; }
    .star-anim:nth-child(4) { animation-delay: 0.6s; }
    .star-anim:nth-child(5) { animation-delay: 0.8s; }
    
    @keyframes spin-refresh {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .refresh-btn:active svg, .refresh-active svg {
      animation: spin-refresh 0.65s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center p-6 antialiased selection:bg-cyan-500/20 selection:text-cyan-300">

  <!-- Background Decorative Ambient Glows -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden flex items-center justify-center">
    <div class="w-[500px] h-[500px] bg-cyan-600/10 rounded-full blur-[120px] -translate-x-32 -translate-y-20"></div>
    <div class="w-[450px] h-[450px] bg-amber-500/10 rounded-full blur-[120px] translate-x-32 translate-y-16"></div>
  </div>

  <div class="relative w-full max-w-md z-10">
    <!-- Card Container -->
    <div class="group relative rounded-xl p-[1px] transition-all duration-500 hover:shadow-xl hover:shadow-cyan-500/15">
      <!-- Gradient Border Layer -->
      <div class="absolute inset-0 rounded-xl bg-gradient-to-r from-cyan-500/40 via-blue-500/20 to-amber-500/30 transition-opacity duration-500 group-hover:opacity-100 opacity-70 blur-[0.5px]"></div>
      
      <!-- Inner Card Content -->
      <div class="relative rounded-xl bg-[#0f172a]/90 backdrop-blur-xl px-4 py-3 shadow-2xl border border-slate-700/50 flex flex-col gap-2.5 overflow-hidden">
        
        <!-- Subtle Top Lighting -->
        <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-3/4 h-8 bg-gradient-to-b from-cyan-400/20 to-transparent blur-xl pointer-events-none"></div>

        <!-- HÀNG 1: HIỆU SUẤT | 10:00–10:59 | 203 máy | 5 sao -->
        <div class="flex items-center justify-between gap-2 pb-2 border-b border-slate-800/80">
          
          <!-- Nhóm nhãn và khung giờ -->
          <div class="flex items-center gap-2">
            <span class="text-[11px] tracking-wider uppercase font-bold text-slate-300 flex items-center gap-1.5">
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping opacity-75"></span>
              HIỆU SUẤT
            </span>
            
            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-mono-num font-semibold text-cyan-300 bg-cyan-950/60 border border-cyan-500/30 shadow-[0_0_8px_rgba(6,182,212,0.2)]">
              10:00–10:59
            </span>
          </div>

          <!-- Nhóm giá trị máy và đánh giá 5 sao -->
          <div class="flex items-center gap-2.5 ml-auto">
            <div class="flex items-baseline gap-1">
              <span class="text-base font-extrabold font-mono-num text-white tracking-tight drop-shadow-[0_1px_6px_rgba(255,255,255,0.25)]">
                203
              </span>
              <span class="text-xs font-medium text-slate-400">máy</span>
            </div>

            <!-- 5 Sao đánh giá -->
            <div class="flex items-center gap-0.5 text-amber-400" title="Đánh giá hiệu suất">
              <!-- Star 1 -->
              <svg class="w-3.5 h-3.5 star-anim fill-amber-400 drop-shadow-[0_0_3px_rgba(251,191,36,0.6)]" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
              </svg>
              <!-- Star 2 -->
              <svg class="w-3.5 h-3.5 star-anim fill-amber-400 drop-shadow-[0_0_3px_rgba(251,191,36,0.6)]" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
              </svg>
              <!-- Star 3 -->
              <svg class="w-3.5 h-3.5 star-anim fill-amber-400 drop-shadow-[0_0_3px_rgba(251,191,36,0.6)]" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
              </svg>
              <!-- Star 4 -->
              <svg class="w-3.5 h-3.5 star-anim fill-amber-400 drop-shadow-[0_0_3px_rgba(251,191,36,0.6)]" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
              </svg>
              <!-- Star 5 -->
              <svg class="w-3.5 h-3.5 star-anim fill-amber-400 drop-shadow-[0_0_3px_rgba(251,191,36,0.6)]" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
              </svg>
            </div>
          </div>
        </div>

        <!-- HÀNG 2: Tổng hôm nay: [ 203 ] | Chi tiết | Nút Refresh -->
        <div class="flex items-center justify-between gap-3 pt-0.5">
          
          <div class="flex items-center gap-2.5">
            <span class="text-xs font-medium text-slate-300 tracking-wide">
              Tổng hôm nay:
            </span>
            
            <!-- Khung số 203 vàng nổi bật gọn hơn -->
            <div class="relative group/box inline-flex items-center justify-center px-2.5 py-0.5 rounded-md bg-amber-500/10 border-2 border-amber-400/90 shadow-[0_0_12px_rgba(251,191,36,0.2)] transition-all duration-300 hover:scale-105 hover:border-amber-300 hover:shadow-[0_0_18px_rgba(251,191,36,0.4)]">
              <span class="font-mono-num text-lg font-black text-amber-400 tracking-wider drop-shadow-[0_0_6px_rgba(251,191,36,0.6)]">
                203
              </span>
            </div>
          </div>

          <!-- Các nút hành động bên phải: Chi tiết & Nút Refresh -->
          <div class="flex items-center gap-2">
            <button class="text-xs font-semibold text-cyan-400 hover:text-cyan-300 transition-colors duration-200 underline-offset-4 hover:underline flex items-center gap-1 focus:outline-none focus:ring-2 focus:ring-cyan-500/40 rounded px-1 py-0.5">
              Chi tiết
            </button>

            <!-- Nút refresh xoay -->
            <button id="refreshBtn" title="Làm mới" class="refresh-btn p-1 rounded-md text-slate-400 hover:text-cyan-300 hover:bg-cyan-950/50 border border-slate-700/60 hover:border-cyan-500/40 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-cyan-500/40">
              <svg class="w-3.5 h-3.5 transition-transform duration-500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"></path>
              </svg>
            </button>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script>
    const refreshBtn = document.getElementById('refreshBtn');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', () => {
        refreshBtn.classList.add('refresh-active');
        setTimeout(() => {
          refreshBtn.classList.remove('refresh-active');
        }, 700);
      });
    }
  </script>




</body></html>
